<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    // GitHub Pages SPA redirect
    // Stocke le path demandé, redirige vers index.html,
    // et main.tsx le restaure ensuite via history.replaceState
    var repo = '/docuSnap';
    var path = window.location.pathname;
    // Si le path commence par le repo, on le garde
    if (path.startsWith(repo + '/')) {
      path = path.slice(repo.length);
    }
    sessionStorage.setItem('redirect', path + window.location.search + window.location.hash);
    window.location.replace(repo + '/');
  </script>
</head>
<body></body>
</html>
