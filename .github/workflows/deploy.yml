# DocuSnap AI — Déploiement GitHub Pages
#
# Secrets requis dans Settings → Secrets and variables → Actions :
#   VITE_GEMINI_API_KEY     — Clé Gemini gratuite (optionnel)
#   VITE_OPENROUTER_API_KEY — Clé OpenRouter gratuite (optionnel)
#
# ⚠️ Ces secrets sont injectés AU BUILD dans le bundle JS.
# Pour Gemini : restreindre le domaine dans Google AI Studio
#   → https://aistudio.google.com → ta clé → HTTP referrer → *.github.io

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Les secrets GitHub Actions → variables Vite côté client
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_OPENROUTER_API_KEY: ${{ secrets.VITE_OPENROUTER_API_KEY }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
